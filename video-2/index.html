<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="./vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="./identity.css" />
  </head>
  <body>
    <!--
      Projet vide, en attente du rush.

      Dès que assets/rush.mp4 est là :
        node scripts/cut-silences.mjs --entree video-2/assets/rush.mp4 \
             --sortie video-2/assets/rush-coupe.mp4 --plan video-2/cuts.json
      puis le rush se branche ici (voir README.md du projet), les cartes de
      motion design se posent sur les moments du discours, et les sous-titres
      sont générés par scripts/subtitles.mjs.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1080"
      data-height="1920"
    >
      <div class="clip" id="attente" data-start="0" data-duration="4" data-track-index="0">
        <div class="carte carte--milieu">
          <div class="etiquette">video-2</div>
          <div class="titre">En attente<br />du rush</div>
          <div class="sous-titre">déposer la vidéo dans assets/</div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(
        "#attente .carte",
        { xPercent: 18, opacity: 0 },
        { xPercent: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.2,
      );
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
