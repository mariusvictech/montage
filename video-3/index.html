<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="./vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="./identity.css" />
  </head>
  <body>
    <!--
      Projet vide, en attente des fichiers (voir assets/README.md) :
        assets/rush.MOV      la vidéo face caméra
        assets/appel.MOV     l'extrait de l'appel client, à insérer en plein cadre
        assets/commande.PNG  la capture de la commande
      Le montage se construit ensuite comme video-2 : coupes sur les creux,
      transcription, sous-titres mot par mot, motion design, sons.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1080"
      data-height="1920"
    >
      <div class="clip" id="attente" data-start="0" data-duration="4" data-track-index="0">
        <div class="carte carte--sommet">
          <div class="etiquette">video-3</div>
          <div class="titre">En attente<br />du rush</div>
          <div class="sous-titre">rush · extrait de l'appel · capture commande</div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(
        "#attente .carte",
        { xPercent: 18, opacity: 0 },
        { xPercent: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.2,
      );
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
