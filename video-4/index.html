<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="./vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="./identity.css" />
  </head>
  <body>
    <!--
      Montage « point sur les shops », deuxième passage.
      Le rush est coupé sur ses creux (2 coupes, 29,21 s → 28,75 s) ;
      les coupes tombent à 3,63 s et 16,41 s du montage, chacune marquée
      par un flash et une respiration d'échelle.
      L'habillage (jauge, coins, pastille Q4) tourne du début à la fin.
      Les sous-titres attendent une transcription exploitable.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="28.7"
      data-width="1080"
      data-height="1920"
    >
      <video
        id="rush"
        class="clip"
        src="assets/rush-coupe.mp4"
        muted
        data-start="0"
        data-duration="28.7"
      ></video>
      <audio id="voix" src="assets/rush-coupe.mp4" data-start="0" data-duration="28.7" data-volume="1"></audio>

      <div class="clip" id="voile" data-start="0" data-duration="28.7" data-track-index="0">
        <div class="voile"></div>
      </div>

      <!-- L'habillage, présent du début à la fin -->
      <div class="clip" id="habillage" data-start="0" data-duration="28.7" data-track-index="0">
        <div class="jauge" id="jauge"></div>
        <div class="coin coin--hg" id="coin-hg"></div>
        <div class="coin coin--hd" id="coin-hd"></div>
        <div class="coin coin--bg" id="coin-bg"></div>
        <div class="coin coin--bd" id="coin-bd"></div>
      </div>

      <!-- La pastille Q4, posée après l'ouverture -->
      <div class="clip" id="c-pastille" data-start="4.20" data-duration="24.5" data-track-index="1">
        <div class="pastille-fixe" id="pastille"><span class="point"></span> Q4 · 2026</div>
      </div>

      <!-- L'ouverture, mot par mot, sur ce qu'il dit vraiment -->
      <div class="clip" id="c-hook" data-start="0.10" data-duration="3.40" data-track-index="1">
        <div class="kinetique">
          <span class="kinetique-mot" id="k1">C'est</span>
          <span class="kinetique-mot" id="k2">maintenant</span>
          <span class="kinetique-mot" id="k3">que tout</span>
          <span class="kinetique-mot punch-mot--vert" id="k4">se joue</span>
        </div>
      </div>

      <!-- Le flash de chaque coupe -->
      <div class="clip" id="c-flash-1" data-start="3.55" data-duration="0.30" data-track-index="2">
        <div class="flash" id="flash-1"></div>
      </div>
      <div class="clip" id="c-flash-2" data-start="16.33" data-duration="0.30" data-track-index="2">
        <div class="flash" id="flash-2"></div>
      </div>

      <!-- La cartouche de fin -->
      <div class="clip" id="c-fin" data-start="26.90" data-duration="1.80" data-track-index="1">
        <div class="punch">
          <span class="punch-mot" id="f1">Like</span>
          <span class="punch-mot punch-mot--vert" id="f2">Abonne-toi</span>
          <div class="punch-barre" id="punch-barre"></div>
        </div>
      </div>

      <audio id="son-hook" src="assets/sfx/clic.wav" data-start="0.20" data-duration="0.12" data-volume="0.4"></audio>
      <audio id="son-coupe-1" src="assets/sfx/souffle.wav" data-start="3.58" data-duration="0.55" data-volume="0.3"></audio>
      <audio id="son-pastille" src="assets/sfx/clic.wav" data-start="4.25" data-duration="0.12" data-volume="0.35"></audio>
      <audio id="son-coupe-2" src="assets/sfx/souffle.wav" data-start="16.36" data-duration="0.55" data-volume="0.3"></audio>
      <audio id="son-impact" src="assets/sfx/impact.wav" data-start="26.95" data-duration="0.35" data-volume="0.4"></audio>
      <audio id="son-fin" src="assets/sfx/basse.wav" data-start="27.30" data-duration="0.90" data-volume="0.45"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      /* L'ouverture : les mots tombent un par un. */
      [
        ["#k1", 0.15],
        ["#k2", 0.38],
        ["#k3", 0.68],
        ["#k4", 0.98],
      ].forEach(([sel, t]) => {
        tl.fromTo(
          sel,
          { opacity: 0, scale: 1.4, y: 24 },
          { opacity: 1, scale: 1, y: 0, duration: 0.26, ease: "power4.out" },
          t,
        );
      });
      tl.to("#c-hook .kinetique", { xPercent: -16, opacity: 0, duration: 0.3, ease: "power2.in" }, 3.2);

      /* La jauge se remplit sur toute la durée. */
      tl.fromTo("#jauge", { scaleX: 0 }, { scaleX: 1, duration: 28.7, ease: "none" }, 0);

      /* Les coins respirent : ils entrent, puis tiennent le cadre. */
      [
        ["#coin-hg", -40, -40],
        ["#coin-hd", 40, -40],
        ["#coin-bg", -40, 40],
        ["#coin-bd", 40, 40],
      ].forEach(([sel, dx, dy], i) => {
        tl.fromTo(
          sel,
          { opacity: 0, x: dx, y: dy },
          { opacity: 0.85, x: 0, y: 0, duration: 0.5, ease: "power3.out" },
          0.6 + i * 0.07,
        );
        tl.to(sel, { opacity: 0.35, duration: 1.2, ease: "sine.inOut" }, 3.6);
      });

      /* La pastille Q4 arrive après l'ouverture. */
      tl.fromTo(
        "#pastille",
        { xPercent: -20, opacity: 0 },
        { xPercent: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        4.2,
      );
      tl.to("#pastille", { opacity: 0, duration: 0.3 }, 26.6);

      /* Chaque coupe reçoit un flash et une respiration d'échelle. */
      [
        ["#flash-1", 3.6],
        ["#flash-2", 16.38],
      ].forEach(([sel, t]) => {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 0.55, duration: 0.06, ease: "power2.out" }, t);
        tl.to(sel, { opacity: 0, duration: 0.2, ease: "power2.in" }, t + 0.06);
        tl.fromTo(
          "#rush",
          { scale: 1.06 },
          { scale: 1, duration: 0.5, ease: "power3.out" },
          t,
        );
      });

      /* La fin : deux temps, puis la barre verte. */
      tl.fromTo("#f1", { opacity: 0, scale: 1.3, y: 18 }, { opacity: 1, scale: 1, y: 0, duration: 0.26, ease: "power4.out" }, 26.95);
      tl.fromTo("#f2", { opacity: 0, scale: 1.3, y: 18 }, { opacity: 1, scale: 1, y: 0, duration: 0.26, ease: "power4.out" }, 27.3);
      tl.fromTo("#punch-barre", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 27.7);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
